<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>do u actually??</title>
<style>
:root{
  --ink:#140f12;
  --muted:#8a7482;
  --cream:#fff3f7;
  --glass:rgba(255,255,255,.58);
  --term:#010604;
  --neo:#39ff8a;
  --glow:0 0 28px rgba(57,255,138,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 800px at 5% 0%,#ffd6ea 0%,transparent 45%),
    radial-gradient(1000px 720px at 100% 100%,#d5ccff 0%,transparent 44%),
    radial-gradient(700px 560px at 50% 40%,#ffe9d6 0%,transparent 50%),
    var(--cream);
  color:var(--ink);
  cursor:none;
  overscroll-behavior:none;
}
.cursor{
  position:fixed;width:14px;height:14px;border-radius:50%;
  border:1.5px solid #1a1218;background:rgba(255,255,255,.6);
  pointer-events:none;z-index:5000;transform:translate(-50%,-50%);
  mix-blend-mode:multiply;
  transition:width .2s cubic-bezier(.16,1,.3,1),height .2s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s;
  will-change:transform;
}
.cursor.hot{width:30px;height:30px;background:rgba(255,126,179,.4);border-color:#ff7eb3}
.orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.42;pointer-events:none;animation:drift 18s ease-in-out infinite;will-change:transform}
.o1{width:420px;height:420px;background:#ff9ec8;top:-160px;left:-140px}
.o2{width:460px;height:460px;background:#c4b5fd;right:-180px;bottom:-170px;animation-delay:-7s}
.o3{width:260px;height:260px;background:#ffd0b0;left:42%;top:26%;animation-delay:-12s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.12)}}
.card{
  width:min(92vw,520px);min-height:min(68vh,440px);
  padding:clamp(32px,5.5vw,48px) clamp(22px,4.5vw,36px) clamp(28px,4.5vw,36px);
  text-align:center;background:var(--glass);
  border:1px solid rgba(255,255,255,.92);border-radius:clamp(24px,5vw,34px);
  backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5);
  box-shadow:0 40px 120px rgba(60,25,60,.14),inset 0 1px rgba(255,255,255,.98);
  position:relative;z-index:10;
  animation:cardIn 1s cubic-bezier(.16,1,.3,1) both;
  overflow:hidden;
  transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1);
}
.card::before{
  content:"";position:absolute;inset:-60%;
  background:radial-gradient(circle at var(--mx,50%) var(--my,20%),rgba(255,255,255,.55),transparent 34%);
  pointer-events:none;opacity:.7;
}
@keyframes cardIn{from{opacity:0;transform:translateY(48px) scale(.9)}to{opacity:1;transform:none}}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 15px;border-radius:999px;
  background:rgba(255,255,255,.85);color:#8b7286;
  font-size:10px;font-weight:700;letter-spacing:1.6px;
  margin-bottom:18px;text-transform:uppercase;
}
.pulse{width:6px;height:6px;border-radius:50%;background:#ff5a9a;box-shadow:0 0 0 0 rgba(255,90,154,.5);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,90,154,.5)}70%{box-shadow:0 0 0 12px rgba(255,90,154,0)}100%{box-shadow:0 0 0 0 rgba(255,90,154,0)}}
h1{font-size:clamp(36px,9vw,60px);letter-spacing:-2.8px;line-height:.92;margin-bottom:10px;font-weight:800}
.subtitle{color:var(--muted);font-size:clamp(13px,3vw,15px);margin-bottom:24px;font-weight:500}
.progressText{color:#a18d9d;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.progress{height:6px;background:rgba(120,90,120,.1);border-radius:99px;overflow:hidden;margin-bottom:24px}
.progressBar{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ff7eb3,#8b5cf6 60%,#60a5fa);
  transition:width .55s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 20px rgba(255,126,179,.45);
}
.game{height:clamp(145px,27vw,170px);width:100%;position:relative}
button{
  border:0;cursor:none;font:inherit;font-weight:700;border-radius:16px;
  padding:14px 28px;position:relative;outline:none;
  -webkit-user-select:none;user-select:none;
}
#yes{
  position:absolute;left:26%;top:50px;
  background:#140f12;color:#fff;
  box-shadow:0 12px 28px rgba(20,15,18,.28);
  transition:left .3s cubic-bezier(.16,1,.3,1),top .3s cubic-bezier(.16,1,.3,1),transform .22s cubic-bezier(.16,1,.3,1),background .35s,box-shadow .35s;
  z-index:2;will-change:left,top,transform;
}
#yes:active{transform:scale(.96)}
#no{
  position:absolute;right:10%;top:50px;
  background:rgba(255,255,255,.82);color:#5c4d5a;
  border:1px solid rgba(255,255,255,.95);
  transition:transform .2s cubic-bezier(.16,1,.3,1);
}
#no:active{transform:scale(.96)}
.status{min-height:22px;color:#8d7788;font-size:13px;font-weight:500}
#terminal{
  position:fixed;inset:0;background:var(--term);color:var(--neo);
  font-family:"SF Mono","Cascadia Code",Consolas,"Fira Code",ui-monospace,monospace;
  z-index:1000;opacity:0;pointer-events:none;
  transition:opacity .6s cubic-bezier(.16,1,.3,1);overflow:hidden;
}
#terminal.active{opacity:1;pointer-events:auto}
.rain{position:absolute;inset:0;opacity:.12;pointer-events:none;z-index:1}
.crt{position:absolute;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%)}
.noise{position:absolute;inset:-50%;pointer-events:none;z-index:52;opacity:.02;
  background:repeating-radial-gradient(circle,#fff 0,#fff 1px,transparent 1px,transparent 5px);
  animation:noise .18s steps(3) infinite}
@keyframes noise{0%{transform:translate(0)}25%{transform:translate(-1%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(1.5%,1.5%)}100%{transform:translate(-1%,-1%)}}
.terminalInner{
  position:absolute;inset:0;padding:clamp(18px,4vw,32px) clamp(18px,4vw,32px);
  overflow:hidden;font-size:clamp(11px,2.6vw,13.5px);line-height:1.6;z-index:10;
  text-shadow:0 0 8px rgba(57,255,138,.55);
}
#terminalText{white-space:pre-wrap;word-break:break-word}
#terminalText .dim{color:rgba(57,255,138,.35)}
#terminalText .ok{color:#7dffb3}
#terminalText .cmd{color:#39ff8a;font-weight:600}
#terminalText .code{color:rgba(57,255,138,.7)}
.blink{display:inline-block;width:7px;height:14px;background:var(--neo);margin-left:2px;
  animation:blink .7s steps(1) infinite;box-shadow:0 0 12px var(--neo);vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.glitchFlash{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(57,255,138,.04) 2px,rgba(57,255,138,.04) 4px)}
.glitchFlash.go{animation:glitchFlash .18s steps(2) forwards}
@keyframes glitchFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.morphStage{position:absolute;inset:0;display:none;z-index:40;overflow:hidden}
.morphStage.on{display:block}
.particle{
  position:absolute;font-weight:600;font-size:clamp(10px,1.4vw,15px);line-height:1;white-space:pre;
  color:var(--neo);text-shadow:0 0 8px rgba(57,255,138,.8);
  transition:left 1.7s cubic-bezier(.12,.8,.16,1),top 1.7s cubic-bezier(.12,.8,.16,1),
    transform 1.7s cubic-bezier(.12,.8,.16,1),opacity .6s cubic-bezier(.16,1,.3,1);
  will-change:left,top,transform,opacity;
}
.decryptStage{
  position:absolute;inset:0;display:none;z-index:55;
  align-items:center;justify-content:center;flex-direction:column;
  opacity:0;transition:opacity .7s cubic-bezier(.16,1,.3,1);pointer-events:none;
}
.decryptStage.on{display:flex;opacity:1}
.ringWrap{position:relative;width:clamp(130px,30vw,170px);height:clamp(130px,30vw,170px);margin-bottom:26px}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(57,255,138,.12)}
.ring.spin{
  border-color:transparent;border-top-color:var(--neo);border-right-color:rgba(57,255,138,.28);
  animation:spin 1.15s linear infinite;filter:drop-shadow(0 0 10px rgba(57,255,138,.5));
}
.ring.spin2{
  inset:11px;border-color:transparent;border-bottom-color:rgba(57,255,138,.45);border-left-color:rgba(57,255,138,.1);
  animation:spin 1.75s linear infinite reverse;
}
.ring.inner{
  inset:26px;border:1px solid rgba(57,255,138,.2);
  background:radial-gradient(circle,rgba(57,255,138,.08),transparent 68%);
}
@keyframes spin{to{transform:rotate(360deg)}}
.decryptPct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,5vw,28px);font-weight:600;color:#e8fff0;
  text-shadow:0 0 20px rgba(57,255,138,.55);letter-spacing:-1px;
}
.decryptLabel{
  font-size:clamp(11px,2.5vw,13px);letter-spacing:4px;text-transform:uppercase;
  color:rgba(57,255,138,.55);font-weight:500;
  animation:softPulse 1.6s ease-in-out infinite;
}
@keyframes softPulse{0%,100%{opacity:.5}50%{opacity:1}}
.hexReveal{
  position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.92);
  opacity:0;z-index:65;text-align:center;max-width:min(90vw,460px);width:100%;
  transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);
  pointer-events:none;padding:0 16px;
}
.hexReveal.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.hexReveal .cipherLabel{
  font-size:clamp(9px,2vw,10px);letter-spacing:3px;text-transform:uppercase;
  color:rgba(57,255,138,.3);margin-bottom:14px;font-weight:500;
}
.hexReveal .hex{
  font-size:clamp(12px,2.8vw,15px);letter-spacing:1px;line-height:1.65;
  color:var(--neo);text-shadow:0 0 16px rgba(57,255,138,.6),0 0 40px rgba(57,255,138,.15);
  font-weight:600;word-break:break-all;text-align:center;
  cursor:pointer;user-select:all;-webkit-user-select:all;
  padding:20px 18px;border-radius:16px;
  background:linear-gradient(165deg,rgba(57,255,138,.09),rgba(57,255,138,.02));
  border:1px solid rgba(57,255,138,.2);
  box-shadow:0 0 50px rgba(57,255,138,.08),inset 0 1px 0 rgba(57,255,138,.1);
  transition:background .25s,border-color .25s,box-shadow .25s,transform .2s;
}
.hexReveal .hex:hover{
  background:linear-gradient(165deg,rgba(57,255,138,.14),rgba(57,255,138,.04));
  border-color:rgba(57,255,138,.35);
  box-shadow:0 0 60px rgba(57,255,138,.12),inset 0 1px 0 rgba(57,255,138,.15);
  transform:scale(1.01);
}
.hexReveal .hex:active{transform:scale(.99)}
.hexReveal .hint{
  margin-top:14px;font-size:clamp(9px,2vw,10px);letter-spacing:1.8px;
  color:rgba(57,255,138,.28);text-transform:uppercase;font-weight:500;
  opacity:0;transition:opacity .5s .4s,color .3s;
}
.hexReveal.show .hint{opacity:1}
.hexReveal .hint.copied{color:rgba(57,255,138,.75)}
.final{
  position:absolute;left:0;right:0;bottom:clamp(32px,7vw,48px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  opacity:0;transform:translateY(20px);z-index:70;
  transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}
.final.show{opacity:1;transform:none}
.final h2{
  font-size:clamp(12px,2.8vw,14px);letter-spacing:.3px;font-weight:500;
  color:var(--neo);text-shadow:var(--glow);max-width:min(88vw,340px);
  line-height:1.4;text-align:center;
}
.flash{position:fixed;inset:0;background:var(--neo);z-index:2000;pointer-events:none;opacity:0}
.flash.go{animation:flash .55s cubic-bezier(.16,1,.3,1)}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.hud{
  position:absolute;top:clamp(14px,3vw,20px);left:clamp(16px,3vw,24px);right:clamp(16px,3vw,24px);
  display:flex;justify-content:space-between;font-size:clamp(9px,2vw,10px);
  letter-spacing:1.4px;color:rgba(57,255,138,.35);z-index:60;
  opacity:0;transition:opacity .6s cubic-bezier(.16,1,.3,1);
}
.hud.on{opacity:1}
.scanline{
  position:absolute;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(57,255,138,.12),transparent);
  z-index:55;pointer-events:none;animation:scan 5.5s linear infinite;
  opacity:0;transition:opacity .6s;
}
.scanline.on{opacity:1}
@keyframes scan{0%{top:-2%}100%{top:102%}}
.burst{
  position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
  background:var(--neo);transform:translate(-50%,-50%) scale(0);
  box-shadow:0 0 40px 20px rgba(57,255,138,.35);
  z-index:58;pointer-events:none;opacity:0;
}
.burst.go{animation:burst .75s cubic-bezier(.16,1,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{opacity:.5}100%{transform:translate(-50%,-50%) scale(20);opacity:0}}
@media(max-width:600px){
  body{cursor:auto}
  .cursor{display:none}
  .card{min-height:min(74vh,440px)}
  .game{height:155px}
  #yes{left:16%;padding:13px 24px}
  #no{right:5%;padding:13px 24px}
  .terminalInner{padding:16px;font-size:11px}
  button{cursor:pointer}
  .hexReveal .hex{font-size:clamp(11px,3vw,13px);padding:16px 14px;letter-spacing:.5px}
}
@media(hover:none){
  body{cursor:auto}
  .cursor{display:none}
  button{cursor:pointer}
}
@media(prefers-reduced-motion:reduce){
  .orb,.noise,.scanline,.pulse,.blink,.ring.spin,.ring.spin2,.decryptLabel{animation:none!important}
  .particle{transition-duration:.35s!important}
}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="card" id="card">
  <div class="badge"><span class="pulse"></span>question</div>
  <h1>do u actually??</h1>
  <div class="subtitle">be honest</div>
  <div class="progressText" id="progressText">0 / 4</div>
  <div class="progress"><div class="progressBar" id="bar"></div></div>
  <div class="game" id="game">
    <button id="yes" type="button">yes</button>
    <button id="no" type="button">no</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div id="terminal">
  <canvas class="rain" id="rain"></canvas>
  <div class="noise"></div><div class="crt"></div><div class="vignette"></div>
  <div class="scanline" id="scanline"></div>
  <div class="hud" id="hud"><span>decoder</span><span id="clock">00:00:00</span></div>
  <div class="terminalInner" id="terminalInner"><div id="terminalText"></div><span class="blink" id="cursorBlink"></span></div>
  <div class="morphStage" id="morphStage"></div>

  <div class="decryptStage" id="decryptStage">
    <div class="ringWrap">
      <div class="ring"></div>
      <div class="ring spin"></div>
      <div class="ring spin2"></div>
      <div class="ring inner"></div>
      <div class="decryptPct" id="decryptPct">0%</div>
    </div>
    <div class="decryptLabel">decrypting</div>
  </div>
  <div class="burst" id="burst"></div>

  <div class="hexReveal" id="hexReveal">
    <div class="cipherLabel">cipher // base64</div>
    <div class="hex" id="hexText">b2sgYnJvbWF0byBubyBvbmVzIHJsbHkgZXZlciBzYWlkIHRoYXQgdG8gbWUgYmVmb3JlIHNvIGlkayB3aGF0IHRvIHNheSDwn5it</div>
    <div class="hint" id="hexHint">tap to copy</div>
  </div>

  <div class="final" id="final"><h2>paste that into chatgpt</h2></div>
</div>
<div class="flash" id="flash"></div>

<script>
const yes=document.getElementById('yes');
const no=document.getElementById('no');
const game=document.getElementById('game');
const bar=document.getElementById('bar');
const progressText=document.getElementById('progressText');
const status=document.getElementById('status');
const card=document.getElementById('card');
const terminal=document.getElementById('terminal');
const terminalText=document.getElementById('terminalText');
const terminalInner=document.getElementById('terminalInner');
const morphStage=document.getElementById('morphStage');
const decryptStage=document.getElementById('decryptStage');
const decryptPct=document.getElementById('decryptPct');
const burst=document.getElementById('burst');
const hexReveal=document.getElementById('hexReveal');
const hexText=document.getElementById('hexText');
const hexHint=document.getElementById('hexHint');
const finalEl=document.getElementById('final');
const flash=document.getElementById('flash');
const hud=document.getElementById('hud');
const clock=document.getElementById('clock');
const cursor=document.getElementById('cursor');
const scanline=document.getElementById('scanline');
const cursorBlink=document.getElementById('cursorBlink');

const CIPHER='b2sgYnJvbWF0byBubyBvbmVzIHJsbHkgZXZlciBzYWlkIHRoYXQgdG8gbWUgYmVmb3JlIHNvIGlkayB3aGF0IHRvIHNheSDwn5it';
const POOL='01ABCDEF<>/\\[]{}#@$%&*+=-';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const glyph=()=>POOL[Math.floor(Math.random()*POOL.length)];
const isTouch=()=>'ontouchstart' in window||navigator.maxTouchPoints>0;

let clicks=0,started=false;

hexText.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(CIPHER)}
  catch{
    const ta=document.createElement('textarea');
    ta.value=CIPHER;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(_){}
    document.body.removeChild(ta);
  }
  hexHint.textContent='copied';
  hexHint.classList.add('copied');
  setTimeout(()=>{hexHint.textContent='tap to copy';hexHint.classList.remove('copied')},1500);
});

function moveYes(){
  const r=game.getBoundingClientRect();
  const pad=10;
  yes.style.left=(Math.random()*Math.max(0,r.width-yes.offsetWidth-pad))+'px';
  yes.style.top=(Math.random()*Math.max(0,r.height-yes.offsetHeight-pad))+'px';
  yes.style.transform=`rotate(${(Math.random()*10-5).toFixed(1)}deg) scale(${(.96+Math.random()*.06).toFixed(2)})`;
}

if(!isTouch()){
  document.addEventListener('mousemove',e=>{
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
    const r=card.getBoundingClientRect();
    if(r.width){
      card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    }
  });
  document.querySelectorAll('button').forEach(b=>{
    b.addEventListener('mouseenter',()=>cursor.classList.add('hot'));
    b.addEventListener('mouseleave',()=>cursor.classList.remove('hot'));
  });
  yes.addEventListener('mouseenter',()=>{
    if(started||clicks>=4) return;
    if(clicks>=1 && Math.random()<.5) moveYes();
  });
}

yes.addEventListener('click',()=>{
  if(started) return;
  clicks++;
  progressText.textContent=`${clicks} / 4`;
  bar.style.width=`${clicks*25}%`;
  if(clicks<4){
    status.textContent=['one','two','one more'][clicks-1];
    moveYes();
  }else{
    started=true;
    yes.textContent='yes';
    yes.style.left='50%';
    yes.style.top='50px';
    yes.style.transform='translateX(-50%) scale(1.05)';
    yes.style.background='linear-gradient(135deg,#ff6da9,#8b5cf6)';
    yes.style.boxShadow='0 14px 36px rgba(139,92,246,.4)';
    status.textContent='';
    setTimeout(startTerminal,800);
  }
});

no.addEventListener('click',()=>{
  status.textContent='ok';
  no.animate(
    [{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],
    {duration:300,easing:'cubic-bezier(.16,1,.3,1)'}
  );
});

async function startTerminal(){
  card.style.opacity='0';
  card.style.transform='scale(1.05) translateY(-10px)';
  await sleep(420);
  terminal.classList.add('active');
  hud.classList.add('on');
  scanline.classList.add('on');
  flash.classList.add('go');
  setTimeout(()=>flash.classList.remove('go'),520);
  startRain();
  startClock();
  await typeIntro();
  await converge();
}

function startClock(){
  const t0=Date.now();
  setInterval(()=>{
    const s=(Date.now()-t0)/1000;
    clock.textContent=
      String(Math.floor(s/60)).padStart(2,'0')+':'+
      String(Math.floor(s%60)).padStart(2,'0')+':'+
      String(Math.floor((s%1)*100)).padStart(2,'0');
  },80);
}

function startRain(){
  const canvas=document.getElementById('rain');
  const ctx=canvas.getContext('2d');
  let cols,drops,speeds,bright;
  const chars='01ABCDEF<>/\\[]{}#@$%&*+=-01アイウエオカキクケコ';
  const resize=()=>{
    canvas.width=innerWidth;canvas.height=innerHeight;
    cols=Math.floor(innerWidth/16);
    drops=Array.from({length:cols},()=>Math.random()*-80);
    speeds=Array.from({length:cols},()=>0.7+Math.random()*1.1);
    bright=Array.from({length:cols},()=>0.25+Math.random()*0.75);
  };
  resize();
  addEventListener('resize',resize,{passive:true});
  (function draw(){
    ctx.fillStyle='rgba(1,6,4,.18)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.font='12px monospace';
    drops.forEach((y,i)=>{
      const alpha=bright[i];
      ctx.fillStyle=`rgba(57,255,138,${alpha})`;
      if(Math.random()>.92) ctx.fillStyle=`rgba(180,255,210,${Math.min(1,alpha+0.3)})`;
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,y*16);
      drops[i]=(y*16>canvas.height+40 && Math.random()>.975)?0:y+speeds[i];
    });
    requestAnimationFrame(draw);
  })();
}

function glitch(){
  const el=document.getElementById('glitchFlash');
  if(!el) return;
  el.classList.remove('go');
  void el.offsetWidth;
  el.classList.add('go');
  setTimeout(()=>el.classList.remove('go'),200);
}

async function typeIntro(){
  terminalText.textContent='';
  const lines=[
    {t:'> system boot',c:'cmd'},
    {t:'> kernel .............. ok',c:'ok'},
    {t:'> signal .............. ok',c:'ok'},
    {t:'',c:''},
    {t:'const stream = await receive()',c:'code'},
    {t:'const buf = new Uint8Array(stream)',c:'code'},
    {t:'',c:''},
    {t:'> reading fragments',c:'dim'},
    {t:'> sorting entropy',c:'dim'},
    {t:'> mapping charset',c:'dim'},
    {t:'',c:''},
    {t:'> payload locked',c:'cmd'},
    {t:'> initiating decrypt...',c:'cmd'}
  ];
  for(const line of lines){
    if(!line.t){
      terminalText.innerHTML+='\\n';
      await sleep(40);
      continue;
    }
    const span=document.createElement('span');
    span.className=line.c;
    terminalText.appendChild(span);
    for(const ch of line.t){
      span.textContent+=ch;
      await sleep(1.2+Math.random()*2.8);
    }
    terminalText.appendChild(document.createTextNode('\\n'));
    terminalInner.scrollTop=terminalInner.scrollHeight;
    await sleep(18+Math.random()*30);
  }
  await sleep(280);
  glitch();
  terminalInner.style.transition='opacity .55s cubic-bezier(.16,1,.3,1)';
  terminalInner.style.opacity='.03';
  if(cursorBlink) cursorBlink.style.opacity='0';
  morphStage.classList.add('on');
}

function makeParticles(){
  morphStage.innerHTML='';
  const count=Math.min(180,Math.max(100,Math.floor(innerWidth/7.5)));
  const a=[];
  for(let i=0;i<count;i++){
    const s=document.createElement('span');
    s.className='particle';
    s.textContent=glyph();
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.opacity=(.18+Math.random()*.8).toFixed(2);
    s.style.fontSize=(10+Math.random()*8)+'px';
    morphStage.appendChild(s);
    a.push(s);
  }
  return a;
}

async function converge(){
  const particles=makeParticles();
  await sleep(280);

  // chaos waves
  for(let wave=0;wave<6;wave++){
    particles.forEach((p,i)=>{
      if(Math.random()<.55) p.textContent=glyph();
      if(Math.random()<.25) p.style.opacity=(.15+Math.random()*.8).toFixed(2);
      if(wave===3 && Math.random()<.15){
        p.style.left=(parseFloat(p.style.left)+(Math.random()*8-4))+'%';
        p.style.top=(parseFloat(p.style.top)+(Math.random()*6-3))+'%';
      }
    });
    if(wave===2||wave===5) glitch();
    await sleep(75+wave*8);
  }

  // spiral pull
  particles.forEach((p,i)=>{
    const a=(i/particles.length)*Math.PI*2+Math.random()*0.4;
    const r=12+Math.random()*28;
    p.style.left=(50+Math.cos(a)*r)+'%';
    p.style.top=(44+Math.sin(a)*r*.58)+'%';
    p.style.transform='scale(1.08)';
  });
  await sleep(1200);

  // collapse
  particles.forEach(p=>{
    p.style.left=(50+(Math.random()-.5)*5)+'%';
    p.style.top=(44+(Math.random()-.5)*3.5)+'%';
    p.style.transform='scale(.4)';
    p.style.opacity='.08';
  });
  await sleep(750);
  morphStage.classList.remove('on');

  // decrypt
  decryptStage.classList.add('on');
  const statuses=['entropy','keyspace','unwrap','rebuild','verify'];
  for(let i=0;i<=32;i++){
    decryptPct.textContent=Math.round((i/32)*100)+'%';
    if(i%7===0 && i>0){
      const label=document.querySelector('.decryptLabel');
      if(label) label.textContent=statuses[Math.min(statuses.length-1,Math.floor(i/7))]||'decrypting';
    }
    await sleep(38+Math.random()*16);
  }
  const label=document.querySelector('.decryptLabel');
  if(label) label.textContent='unlocked';
  await sleep(220);

  glitch();
  burst.classList.add('go');
  decryptStage.style.transition='opacity .4s cubic-bezier(.16,1,.3,1)';
  decryptStage.style.opacity='0';
  await sleep(450);
  decryptStage.classList.remove('on');
  decryptStage.style.opacity='';
  burst.classList.remove('go');

  // bloom then out
  morphStage.classList.add('on');
  const p2=makeParticles();
  p2.forEach(p=>{
    const a=Math.random()*Math.PI*2,r=8+Math.random()*35;
    p.style.left=(50+Math.cos(a)*r)+'%';
    p.style.top=(46+Math.sin(a)*r*.6)+'%';
    p.style.opacity='.65';
    p.style.transform='scale(1.1)';
  });
  await sleep(280);
  p2.forEach(p=>{
    p.style.opacity='0';
    p.style.transform='scale(.15)';
  });
  await sleep(600);
  morphStage.classList.remove('on');

  hexReveal.classList.add('show');
  await sleep(1000);
  finalEl.classList.add('show');
}
</script>
